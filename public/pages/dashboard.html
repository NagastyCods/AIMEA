<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Admin Dashboard</title>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="logo">AIMEA Admin</div>
            <nav class="sidebar-menu">
                <a href="dashboard.html" class="active"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                <a href="user-management.html"><i class="fa-solid fa-users"></i> SOS Alerts</a>
                <a href="reports.html"><i class="fa-solid fa-file-alt"></i> Users</a>
                <a href="settings.html"><i class="fa-solid fa-cog"></i>Hospitals</a>
                <a href="../index.html"><i class="fa-solid fa-sign-out-alt"></i> Logout</a>
            </nav>
        </aside>
        <main class="main-content">
            <header class="admin-header">
                <h1>Dashboard</h1>
                <div class="admin-actions">
                    <button class="notification-btn"><i class="fa-solid fa-bell"></i></button>
                    <div class="admin-profile">
                        <img src="../images/admin-avatar.png" alt="Admin Avatar">
                        <span>Admin</span>
                    </div>
                </div>
            </header>

            <section class="dashboard-overview">
                <div class="overview-cards">
                    <div class="card">
                        <h3>Total Users</h3>
                        <p>1,234</p>
                    </div>
                    <div class="card">
                        <h3>Active Alerts</h3>
                        <p>56</p>
                    </div>
                    <div class="card">
                        <h3>Hospitals Connected</h3>
                        <p>12</p>
                    </div>
                </div>
            </section>

            <section class="dashboard-details">
                <!-- Additional dashboard details and charts can be added here -->
            </section>
    </div>
</body>
</html>
